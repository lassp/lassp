<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>LASSP — Subpage Title</title>

  <link rel="icon" type="image/x-icon" href="../../img/favicon.ico" />

  <!-- Common site styles -->
  <link rel="stylesheet" href="../../css/site.css">
  <link rel="stylesheet" href="../../css/map.css">
  <link rel="stylesheet" href="../../css/nav-layout.css">
  <link rel="stylesheet" href="../../css/strip-nav.css">
</head>

<body>
  <!-- Header / Nav (same structure as root, corrected paths for 2 levels deep) -->
  <header class="nav">
    <a class="brand" href="../">
      <span class="lassp-yellow">Los Angeles Solar System Project</span>
    </a>
    <nav id="strip-nav" class="strip-nav" aria-label="Solar system navigation">
      <!-- populated by JS -->
    </nav>
  </header>

  <main class="page">
    <header class="page-header">
      <h1 data-bind="modelSubpageTitle"></h1>
      <div class="marker-body" data-bind="bodyParagraphs"></div>
    </header>

    <!-- Begin editable sections -->

    <h2>Photo Illustration</h2>
    <section id="illustration" class="illustration-panel">
      <article class="card">
        <a href="/img/illustrations/venus.jpg" target="_blank" rel="noopener"><img src="/img/illustrations/venus.jpg" alt="Illustration of Venus" loading="lazy" /></a>
      </article>
    </section>

    <section id="map-marker" class="marker-map content">
      <h2>Potential Location</h2>
      <article class="card">
        <div id="marker-map" class="marker-map-canvas" aria-label="Marker location map"></div>
      </article>
    </section>

    <h2>Fabrication Drawing</h2>
    <section id="fabdrawing" class="fabdrawing-panel">
      <article class="card">
        <a href="/img/fabdrawings/venus-fab.jpg" target="_blank" rel="noopener"><img src="/img/fabdrawings/venus-fab.jpg" alt="Fabrication drawing of Venus" loading="lazy" /></a>
      </article>
    </section>
    (<a href="/downloads/lassp_fab.pdf">Click here to download complete fabrication package</a>)
    <!-- End editable sections -->

    <div class="pager" data-bind="prevNextNav" hidden>
      <a class="pager-link" data-bind="prevMarker" hidden aria-label="Previous object"></a>
      <a class="pager-link" data-bind="nextMarker" hidden aria-label="Next object"></a>
    </div>

    <footer>
      <p>
        &copy; 2005 - <span id="year"></span> by Jack Anderson, all rights reserved.
      </p>
    </footer>
  </main>

  <!-- Common site behavior (nav menu, year, etc.) -->
  <script src="../../js/site.js" defer></script>
  <script src="../../js/map.js" defer></script>
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBFJ8V1qydk_HtNbvdlkK2yAkYf5GXNhTI&v=weekly&libraries=marker"
    defer></script>

  <!-- Optional fallback year; runs after parsing -->
  <script defer>
    const y = document.getElementById("year");
    if (y) y.textContent = new Date().getFullYear();
  </script>
</body>

</html>
